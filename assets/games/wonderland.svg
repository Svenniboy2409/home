<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Original icon for the platform game: a bouncing star over floating platforms in a dusk sky. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b4dff"/>
      <stop offset="55%" stop-color="#d45cd8"/>
      <stop offset="100%" stop-color="#ff9a6b"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff3b0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6a8"/>
      <stop offset="60%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9dfa8a"/>
      <stop offset="100%" stop-color="#3fc46a"/>
    </linearGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9774a"/>
      <stop offset="100%" stop-color="#7a4527"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#5b33c9" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="200" r="170" fill="url(#sun)" opacity="0.55"/>
  <path d="M0 400 C 80 330 150 330 230 380 C 300 425 380 330 512 360 L512 512 L0 512 Z" fill="url(#hill)"/>
  <g fill="#fff" opacity="0.85">
    <circle cx="80" cy="90" r="4"/><circle cx="430" cy="110" r="3"/><circle cx="400" cy="60" r="2.5"/>
    <circle cx="120" cy="190" r="2.5"/><circle cx="460" cy="230" r="3"/>
  </g>
  <!-- motion arc -->
  <path d="M96 330 Q 170 120 256 170" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.8"/>
  <!-- platforms -->
  <g>
    <rect x="52" y="352" width="150" height="48" rx="16" fill="url(#soil)"/>
    <rect x="52" y="344" width="150" height="24" rx="12" fill="url(#grass)"/>
    <rect x="300" y="300" width="160" height="50" rx="16" fill="url(#soil)"/>
    <rect x="300" y="292" width="160" height="24" rx="12" fill="url(#grass)"/>
    <rect x="200" y="420" width="120" height="44" rx="16" fill="url(#soil)"/>
    <rect x="200" y="412" width="120" height="22" rx="11" fill="url(#grass)"/>
  </g>
  <!-- the star -->
  <g transform="translate(300 170) rotate(12)">
    <path d="M0 -78 L22 -26 L78 -22 L35 14 L48 70 L0 41 L-48 70 L-35 14 L-78 -22 L-22 -26 Z" fill="url(#star)" stroke="#fff6c7" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-34 -18 L-10 -20" stroke="#fffbe0" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  </g>
  <!-- sparkles -->
  <path d="M410 190 l6 18 l18 6 l-18 6 l-6 18 l-6 -18 l-18 -6 l18 -6 z" fill="#fff"/>
  <path d="M170 120 l4 12 l12 4 l-12 4 l-4 12 l-4 -12 l-12 -4 l12 -4 z" fill="#fff"/>
</svg>

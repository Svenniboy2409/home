<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Original icon for the board games: two tumbling dice and a pawn on a checkered board. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c3b0"/>
      <stop offset="100%" stop-color="#1a4f8f"/>
    </linearGradient>
    <linearGradient id="die" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e4e8f5"/>
    </linearGradient>
    <linearGradient id="pawn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff9a8a"/>
      <stop offset="100%" stop-color="#e2445c"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- board in perspective -->
  <g clip-path="url(#tile)" opacity="0.9">
    <g transform="translate(256 520) scale(1 0.42) rotate(45)">
      <g fill="#ffffff" opacity="0.16">
        <rect x="-320" y="-320" width="80" height="80"/><rect x="-160" y="-320" width="80" height="80"/><rect x="0" y="-320" width="80" height="80"/><rect x="160" y="-320" width="80" height="80"/>
        <rect x="-240" y="-240" width="80" height="80"/><rect x="-80" y="-240" width="80" height="80"/><rect x="80" y="-240" width="80" height="80"/><rect x="240" y="-240" width="80" height="80"/>
        <rect x="-320" y="-160" width="80" height="80"/><rect x="-160" y="-160" width="80" height="80"/><rect x="0" y="-160" width="80" height="80"/><rect x="160" y="-160" width="80" height="80"/>
        <rect x="-240" y="-80" width="80" height="80"/><rect x="-80" y="-80" width="80" height="80"/><rect x="80" y="-80" width="80" height="80"/><rect x="240" y="-80" width="80" height="80"/>
        <rect x="-320" y="0" width="80" height="80"/><rect x="-160" y="0" width="80" height="80"/><rect x="0" y="0" width="80" height="80"/><rect x="160" y="0" width="80" height="80"/>
        <rect x="-240" y="80" width="80" height="80"/><rect x="-80" y="80" width="80" height="80"/><rect x="80" y="80" width="80" height="80"/><rect x="240" y="80" width="80" height="80"/>
      </g>
    </g>
  </g>
  <g fill="#fff" opacity="0.8">
    <circle cx="70" cy="80" r="3"/><circle cx="440" cy="70" r="3.5"/><circle cx="400" cy="150" r="2.4"/><circle cx="110" cy="200" r="2.2"/>
  </g>
  <!-- die 1 -->
  <g transform="translate(170 230) rotate(-14)">
    <rect x="-78" y="-78" width="156" height="156" rx="34" fill="#0f2f55" opacity="0.25" transform="translate(8 12)"/>
    <rect x="-78" y="-78" width="156" height="156" rx="34" fill="url(#die)"/>
    <g fill="#1a2b52">
      <circle cx="-36" cy="-36" r="14"/><circle cx="36" cy="-36" r="14"/>
      <circle cx="0" cy="0" r="14"/>
      <circle cx="-36" cy="36" r="14"/><circle cx="36" cy="36" r="14"/>
    </g>
  </g>
  <!-- die 2 -->
  <g transform="translate(340 170) rotate(18)">
    <rect x="-62" y="-62" width="124" height="124" rx="28" fill="#0f2f55" opacity="0.25" transform="translate(8 12)"/>
    <rect x="-62" y="-62" width="124" height="124" rx="28" fill="url(#die)"/>
    <g fill="#e2445c">
      <circle cx="-28" cy="-28" r="12"/><circle cx="28" cy="28" r="12"/><circle cx="0" cy="0" r="12"/>
    </g>
  </g>
  <!-- pawn -->
  <g transform="translate(350 370)">
    <ellipse cx="0" cy="66" rx="70" ry="16" fill="#0f2f55" opacity="0.3"/>
    <path d="M-58 60 C -58 40 -40 34 -26 30 C -18 10 -14 -6 -20 -18 L 20 -18 C 14 -6 18 10 26 30 C 40 34 58 40 58 60 Z" fill="url(#pawn)"/>
    <rect x="-34" y="-30" width="68" height="16" rx="8" fill="#ff8a7a"/>
    <circle cx="0" cy="-56" r="32" fill="url(#pawn)"/>
    <circle cx="-11" cy="-66" r="9" fill="#fff" opacity="0.55"/>
  </g>
</svg>

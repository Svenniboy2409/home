<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Starport mark: a glowing ringed station with a guiding star. Transparent background. -->
  <defs>
    <radialGradient id="sp-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9fe8ff" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7c6cff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7c6cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sp-core" cx="38%" cy="32%" r="75%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="22%" stop-color="#c9f3ff"/>
      <stop offset="58%" stop-color="#7d86ff"/>
      <stop offset="100%" stop-color="#2b1c6e"/>
    </radialGradient>
    <linearGradient id="sp-ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ff7d4"/>
      <stop offset="50%" stop-color="#9d8bff"/>
      <stop offset="100%" stop-color="#ff7ac6"/>
    </linearGradient>
    <clipPath id="sp-front">
      <rect x="0" y="32" width="64" height="32"/>
    </clipPath>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#sp-glow)"/>
  <g transform="rotate(-18 32 32)">
    <ellipse cx="32" cy="32" rx="27" ry="8.5" fill="none" stroke="url(#sp-ring)" stroke-width="3" opacity="0.55"/>
  </g>
  <circle cx="32" cy="32" r="13.5" fill="url(#sp-core)"/>
  <ellipse cx="27.5" cy="26.5" rx="4.5" ry="2.6" fill="#fff" opacity="0.55" transform="rotate(-30 27.5 26.5)"/>
  <g transform="rotate(-18 32 32)">
    <ellipse cx="32" cy="32" rx="27" ry="8.5" fill="none" stroke="url(#sp-ring)" stroke-width="3" stroke-linecap="round" clip-path="url(#sp-front)"/>
    <circle cx="59" cy="32" r="2.2" fill="#ffffff"/>
  </g>
  <path d="M50 5.5 L51.4 10.6 L56.5 12 L51.4 13.4 L50 18.5 L48.6 13.4 L43.5 12 L48.6 10.6 Z" fill="#fff"/>
</svg>
